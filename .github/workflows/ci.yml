name: CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.26.10', '1.27.3']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: true

    - name: Build Core
      run: go build -v ./...

    - name: Test Core
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Build Gin Adapter
      run: |
        cd adapters/gin
        go mod tidy
        go build .

    - name: Build Fiber Adapter
      run: |
        cd adapters/fiber
        go mod tidy
        go build .

    - name: Build Echo Adapter
      run: |
        cd adapters/echo
        go mod tidy
        go build .

    - name: Build Chi Adapter
      run: |
        cd adapters/chi
        go mod tidy
        go build .

    - name: Upload coverage reports to Codecov
      if: matrix.go-version == '1.26.10'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
